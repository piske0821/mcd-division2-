<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mc Donalds - 全境封鎖2 小工具</title>
    <style>
        /* Discord 風格自訂滾動條 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #2b2d31;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #1a1b1e;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #35373c;
        }

        body {
            background-color: #313338;
            color: #dbdee1;
            font-family: "Microsoft JhengHei", sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            user-select: none;
        }
        /* 左側導覽列 */
        .sidebar {
            width: 300px;
            background-color: #2b2d31;
            padding: 15px;
            box-sizing: border-box;
            flex-shrink: 0;
            overflow-y: auto;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #35373c;
        }
        .sidebar h3 { color: #f2f3f5; font-size: 16px; margin: 0; cursor: pointer; }
        .sidebar-actions {
            display: flex;
            gap: 6px;
        }
        .sidebar-btn {
            background: none;
            border: none;
            color: #949ba4;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        .sidebar-btn:hover { color: #f2f3f5; }

        .category-group {
            margin-bottom: 6px;
        }
        .category-group.drag-over .channel-list {
            background-color: rgba(88, 101, 242, 0.15);
            border-radius: 4px;
            outline: 2px dashed #5865f2;
        }

        .category-header {
            font-size: 12px;
            font-weight: bold;
            color: #949ba4;
            text-transform: uppercase;
            margin: 10px 0 2px 2px;
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }
        .category-header:hover {
            color: #dbdee1;
            background-color: #35373c;
        }
        .category-arrow {
            display: inline-block;
            transition: transform 0.15s ease;
            margin-right: 6px;
            font-size: 10px;
        }
        .category-group.collapsed .category-arrow {
            transform: rotate(-90deg);
        }
        .category-group.collapsed .channel-list {
            display: none;
        }
        
        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-height: 4px;
            padding: 2px 0;
        }

        .channel-item {
            display: flex;
            align-items: center;
            padding: 7px 8px 7px 16px;
            border-radius: 4px;
            cursor: pointer;
            color: #949ba4;
            font-size: 14px;
        }
        .channel-item:hover {
            background-color: #35373c;
            color: #dbdee1;
        }
        .channel-item.active {
            background-color: #35373c;
            color: #f2f3f5; 
            font-weight: bold;
        }
        .channel-item.dragging {
            opacity: 0.4;
        }
        .channel-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 右側主內容區 */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            box-sizing: border-box;
            user-select: text;
        }
        .top-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-bar {
            flex: 1;
            min-width: 200px;
            padding: 10px;
            background-color: #1e1f22;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }
        .search-bar:focus { outline: none; }
        .add-btn {
            padding: 10px 15px;
            background-color: #5865f2;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .add-btn:hover { background-color: #4752c4; }

        .paste-btn {
            padding: 10px 15px;
            background-color: #248046;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            display: none;
        }
        .paste-btn:hover { background-color: #1a6335; }

        .export-btn {
            padding: 10px 15px;
            background-color: #e67e22;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            display: none;
        }
        .export-btn:hover { background-color: #d35400; }
        
        /* 卡片網格 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        .card {
            background-color: #2b2d31;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border-left: 4px solid #4f545c;
            position: relative;
        }
        .card.editable {
            cursor: grab;
        }
        .card.editable:active {
            cursor: grabbing;
        }
        .card.dragging {
            opacity: 0.4;
        }
        .card.drag-over {
            border: 2px dashed #5865f2;
            background-color: rgba(88, 101, 242, 0.1);
        }
        
        .card h4 { margin: 0; font-size: 17px; }
        .card-header-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
        .card-header-left { display: flex; align-items: center; gap: 6px; overflow: hidden; }
        .card-weapon-img {
            width: 100%;
            max-height: 130px;
            object-fit: contain;
            border-radius: 6px;
            background: #1e1f22;
            display: block;
        }

        .color-red { color: #ed4245 !important; }
        .color-gold { color: #faa61a !important; }
        .color-green { color: #248046 !important; }
        .color-gray { color: #949ba4 !important; }

        /* 屬性緊鄰靠左對齊，支援左右雙圖示 */
        .attr-item {
            font-size: 13px;
            margin: 6px 0;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
        }
        .attr-text-side {
            font-weight: bold;
            color: #00b0f4;
            flex-shrink: 0;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .attr-val { 
            color: #b9bbbe; 
            text-align: left; 
            word-break: break-all;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card details {
            background-color: #1e1f22;
            padding: 8px;
            border-radius: 4px;
            margin: 8px 0;
            font-size: 13px;
            color: #b9bbbe;
            border: 1px dashed #faa61a;
        }
        .card summary {
            cursor: pointer;
            color: #faa61a;
            font-weight: bold;
        }

        .card a, .modal-content a {
            color: #00b0f4;
            text-decoration: underline;
            word-break: break-all;
        }
        .card a:hover, .modal-content a:hover {
            color: #1dc0ff;
        }

        .badge {
            display: inline-block;
            background-color: #faa61a;
            color: #000;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 6px;
        }
        
        .card-actions {
            margin-top: 10px;
            display: flex;
            gap: 5px;
            justify-content: flex-end;
            display: none;
        }
        .card-actions button {
            padding: 3px 8px;
            font-size: 11px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .btn-copy { background-color: #2b4c7e; color: #fff; }
        .btn-copy:hover { background-color: #3b639e; }
        .btn-edit { background-color: #4f545c; color: #fff; }
        .btn-delete { background-color: #ed4245; color: #fff; }

        #dcContextMenu {
            display: none;
            position: fixed;
            background-color: #111214;
            border-radius: 4px;
            padding: 6px;
            width: 170px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            z-index: 2000;
            box-sizing: border-box;
        }
        .menu-item {
            padding: 8px 10px;
            font-size: 13px;
            color: #b5bac1;
            border-radius: 3px;
            cursor: pointer;
        }
        .menu-item:hover {
            background-color: #5865f2;
            color: #fff;
        }
        .menu-item.danger:hover {
            background-color: #da373c;
            color: #fff;
        }
        .menu-divider {
            height: 1px;
            background-color: #2b2d31;
            margin: 4px 0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: #313338;
            padding: 25px;
            border-radius: 8px;
            width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            color: #dbdee1;
        }
        .modal-content h3 { margin-top: 0; color: #f2f3f5; }
        .modal-content input[type="text"], .modal-content textarea, .modal-content select {
            width: 100%;
            padding: 8px;
            margin: 6px 0 12px 0;
            background-color: #1e1f22;
            border: 1px solid #222;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #faa61a;
            cursor: pointer;
        }
        .checkbox-group input { cursor: pointer; width: 16px; height: 16px; margin: 0; }
        
        .attr-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
            align-items: center;
        }
        .attr-row input { margin: 0; }
        .btn-remove-attr {
            background-color: #ed4245;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-add-attr {
            background-color: #248046;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .modal-buttons { text-align: right; margin-top: 15px; }
        .modal-buttons button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-cancel { background-color: #4f545c; color: #fff; margin-right: 10px; }
        .btn-save { background-color: #248046; color: #fff; }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            .sidebar {
                width: 100%;
                max-height: 220px;
                border-bottom: 2px solid #1e1f22;
            }
            .main-content {
                padding: 15px;
            }
            .card-grid {
                grid-template-columns: 1fr;
            }
            .modal-content {
                width: 90% !important;
                padding: 15px;
            }
        }
    </style>
</head>
<body onclick="hideContextMenu()">

    <div class="sidebar">
        <div class="sidebar-header">
            <h3 id="appTitle" onclick="handleTitleClick()">MCD全境2小工具</h3>
            <div class="sidebar-actions" id="adminSidebarActions" style="display:none;">
                <button class="sidebar-btn" onclick="openCategoryModal()" title="新增類別">＋類別</button>
                <button class="sidebar-btn" onclick="openChannelModal()" title="新增頻道">＋頻道</button>
            </div>
        </div>
        <div id="sidebarTree"></div>
    </div>

    <div class="main-content">
        <div class="top-controls">
            <input type="text" id="searchInput" class="search-bar" placeholder="搜尋名稱、天賦或屬性..." onkeyup="filterData()">
            <button id="exportBtn" class="export-btn" onclick="exportDataJson()" style="display:none;">💾 匯出資料</button>
            <button id="pasteBtn" class="paste-btn" onclick="pasteCard()" style="display:none;">📋 貼上卡片</button>
            <button id="addCardMainBtn" class="add-btn" onclick="openModal()" style="display:none;">＋ 新增資料</button>
        </div>
        <div id="cardGrid" class="card-grid"></div>
    </div>

    <div id="dcContextMenu">
        <div id="menuAddChannel" class="menu-item" onclick="handleMenuAddChannel()" style="display:none;">新增頻道</div>
        <div id="menuMoveUp" class="menu-item" onclick="handleMenuMoveUp()">往上移動</div>
        <div id="menuMoveDown" class="menu-item" onclick="handleMenuMoveDown()">往下移動</div>
        <div class="menu-divider" id="menuDivider"></div>
        <div id="menuEdit" class="menu-item" onclick="handleMenuEdit()">編輯</div>
        <div id="menuDelete" class="menu-item danger" onclick="handleMenuDelete()">刪除</div>
    </div>

    <!-- 新增/編輯卡片視窗 -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">新增資料</h3>
            <input type="hidden" id="editIndex" value="-1">
            <input type="hidden" id="editTabKey" value="">
            
            <label>裝備名稱:</label>
            <input type="text" id="inputName" placeholder="例如：聖艾爾摩引擎">

            <label>武器圖片 (更大尺寸，右鍵可清除):</label>
            <div style="margin-bottom: 12px;">
                <div id="weaponImgPreviewBox" style="width: 100%; height: 90px; background: #1e1f22; border: 1px dashed #5865f2; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer;" onclick="document.getElementById('inputWeaponImgFile').click()" oncontextmenu="handleWeaponImageContextMenu(event)" title="點擊上傳武器大圖 (右鍵清除)">
                    <span style="font-size: 13px; color: #949ba4;">＋ 點擊上傳武器大圖</span>
                </div>
                <input type="file" id="inputWeaponImgFile" accept="image/*" style="display:none;" onchange="handleWeaponImageUpload(this)">
            </div>

            <label>裝備名稱顏色:</label>
            <select id="inputColor">
                <option value="color-gold">金色 (具名)</option>
                <option value="color-red">紅色 (奇特)</option>
                <option value="color-green">綠色</option>
                <option value="color-gray">灰色</option>
            </select>
            
            <label>天賦與效果說明:</label>
            <textarea id="inputEffect" rows="3" placeholder="請輸入天賦及效果說明..."></textarea>

            <label class="checkbox-group">
                <input type="checkbox" id="inputIsSpoiler"> 📦 設為防劇透區塊 (解謎攻略)
            </label>
            <textarea id="inputSpoilerContent" rows="3" placeholder="請在此輸入詳細解謎步驟..." style="display:none;"></textarea>

            <label>屬性與取得管道列表 (支援左右雙小圖示，右鍵可清除):</label>
            <div id="attrContainer"></div>
            <button type="button" class="btn-add-attr" onclick="addAttrRow()">＋ 新增一條屬性</button>

            <label>備註 / 標籤:</label>
            <input type="text" id="inputNamed" placeholder="例如：突擊步槍 / 核心神兵">

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-save" onclick="saveData()">儲存</button>
            </div>
        </div>
    </div>

    <!-- 類別視窗 -->
    <div id="categoryModal" class="modal">
        <div class="modal-content" style="width: 350px;">
            <h3 id="categoryModalTitle">新增類別</h3>
            <input type="hidden" id="editCategoryId" value="">
            <label>類別名稱:</label>
            <input type="text" id="inputCategoryName" placeholder="例如：奇特武器">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeCategoryModal()">取消</button>
                <button class="btn-save" onclick="saveCategory()">儲存</button>
            </div>
        </div>
    </div>

    <!-- 頻道視窗 -->
    <div id="channelModal" class="modal">
        <div class="modal-content" style="width: 350px;">
            <h3 id="channelModalTitle">新增頻道</h3>
            <input type="hidden" id="editChannelId" value="">
            <label>選擇歸屬類別:</label>
            <select id="inputChannelCategory"></select>
            <label>頻道名稱:</label>
            <input type="text" id="inputChannelName" placeholder="例如：突擊步槍">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeChannelModal()">取消</button>
                <button class="btn-save" onclick="saveChannel()">儲存</button>
            </div>
        </div>
    </div>

    <script>
        let isAdmin = localStorage.getItem('division2_is_admin_v21') === 'true';
        let titleClickCount = 0;
        let titleClickTimer = null;

        function handleTitleClick() {
            if (isAdmin) {
                if (confirm('目前已處於管理模式，是否要登出並上鎖？')) {
                    localStorage.setItem('division2_is_admin_v21', 'false');
                    isAdmin = false;
                    location.reload();
                }
                return;
            }
            titleClickCount++;
            if (titleClickTimer) clearTimeout(titleClickTimer);
            if (titleClickCount >= 4) {
                titleClickCount = 0;
                let pwd = prompt('請輸入解鎖密碼：');
                if (pwd === '薯條好吃') {
                    localStorage.setItem('division2_is_admin_v21', 'true');
                    isAdmin = true;
                    alert('解鎖成功！已切換為管理員模式。');
                    location.reload();
                } else if (pwd !== null) {
                    alert('密碼錯誤！');
                }
            } else {
                titleClickTimer = setTimeout(() => { titleClickCount = 0; }, 1000);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (isAdmin) {
                document.getElementById('adminSidebarActions').style.display = 'flex';
                document.getElementById('addCardMainBtn').style.display = 'block';
                document.getElementById('exportBtn').style.display = 'block';
                if (copiedCardData) {
                    document.getElementById('pasteBtn').style.display = 'block';
                }
            }
        });

        const defaultCategories = [{ id: "cat_default", name: "未分類" }];
        const defaultChannels = [{ id: "ch_default", name: "一般頻道", catId: "cat_default" }];
        const defaultDb = { "ch_default": [] };

        let categories = [];
        let channels = [];
        let db = {};
        let currentTab = '';
        let collapsedCategories = JSON.parse(localStorage.getItem('division2_collapsed_v21')) || {};
        let contextMenuTarget = null;
        let draggedChannelId = null;
        let draggedCardIndex = null;
        let copiedCardData = null;
        let currentWeaponImgBase64 = ''; 

        async function initData() {
            try {
                let response = await fetch('data.json');
                if (response.ok) {
                    let jsonData = await response.json();
                    categories = jsonData.categories || defaultCategories;
                    channels = jsonData.channels || defaultChannels;
                    db = jsonData.db || defaultDb;
                } else {
                    loadFromLocalStorage();
                }
            } catch (e) {
                loadFromLocalStorage();
            }

            if (!channels.some(ch => ch.id === currentTab)) {
                currentTab = channels.length > 0 ? channels[0].id : '';
            }
            renderSidebar();
            filterData();
        }

        function loadFromLocalStorage() {
            categories = JSON.parse(localStorage.getItem('division2_categories_v21')) || defaultCategories;
            channels = JSON.parse(localStorage.getItem('division2_channels_v21')) || defaultChannels;
            db = JSON.parse(localStorage.getItem('division2_db_v21')) || defaultDb;
            currentTab = channels.length > 0 ? channels[0].id : '';
        }

        function exportDataJson() {
            if (!isAdmin) return;
            const dataToExport = {
                categories: categories,
                channels: channels,
                db: db
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataToExport, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "data.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            alert('已成功匯出 data.json！請將此檔案上傳到你的 GitHub 專案根目錄中覆蓋即可。');
        }

        document.getElementById('inputIsSpoiler').addEventListener('change', function() {
            const spoilerBox = document.getElementById('inputSpoilerContent');
            spoilerBox.style.display = this.checked ? 'block' : 'none';
        });

        function handleWeaponImageUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentWeaponImgBase64 = e.target.result;
                    const previewBox = document.getElementById('weaponImgPreviewBox');
                    previewBox.innerHTML = `<img src="${currentWeaponImgBase64}" style="width: 100%; height: 100%; object-fit: contain; border-radius: 4px;">`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function handleWeaponImageContextMenu(e) {
            e.preventDefault();
            if (currentWeaponImgBase64 && confirm('確定要清除這張武器大圖嗎？')) {
                currentWeaponImgBase64 = '';
                document.getElementById('weaponImgPreviewBox').innerHTML = `<span style="font-size: 13px; color: #949ba4;">＋ 點擊上傳武器大圖</span>`;
                document.getElementById('inputWeaponImgFile').value = '';
            }
        }

        function linkify(inputText) {
            if (!inputText) return '';
            let replacePattern = /(\b(https?|ftp):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/gim;
            return inputText.replace(replacePattern, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
        }

        function renderSidebar() {
            const container = document.getElementById('sidebarTree');
            let html = '';
            categories.forEach(cat => {
                let catChannels = channels.filter(ch => ch.catId === cat.id);
                let isCollapsed = collapsedCategories[cat.id] ? 'collapsed' : '';
                let catContextAttr = isAdmin ? `oncontextmenu="showContextMenu(event, 'cat', '${cat.id}')"` : '';
                let catDragAttr = isAdmin ? `ondragover="allowDrop(event, '${cat.id}')" ondragleave="leaveDrop(event, '${cat.id}')" ondrop="dropChannel(event, '${cat.id}')"` : '';

                html += `
                    <div class="category-group ${isCollapsed}" id="cat_group_${cat.id}" ${catDragAttr}>
                        <div class="category-header" onclick="toggleCategory('${cat.id}')" ${catContextAttr}>
                            <span class="category-arrow">▼</span>
                            <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${cat.name}</span>
                        </div>
                        <div class="channel-list">
                `;
                catChannels.forEach(ch => {
                    let isActive = currentTab === ch.id ? 'active' : '';
                    let chDragAttr = isAdmin ? `draggable="true" ondragstart="dragStart(event, '${ch.id}')" ondragend="dragEnd(event)"` : '';
                    let chContextAttr = isAdmin ? `oncontextmenu="showContextMenu(event, 'ch', '${ch.id}')"` : '';

                    html += `
                        <div class="channel-item ${isActive}" ${chDragAttr} onclick="switchTab('${ch.id}')" ${chContextAttr}>
                            <span class="channel-name"># ${ch.name}</span>
                        </div>
                    `;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function dragStart(e, chId) { if (!isAdmin) return; draggedChannelId = chId; e.target.classList.add('dragging'); }
        function dragEnd(e) { if (!isAdmin) return; draggedChannelId = null; e.target.classList.remove('dragging'); document.querySelectorAll('.category-group').forEach(el => el.classList.remove('drag-over')); }
        function allowDrop(e, catId) { if (!isAdmin) return; e.preventDefault(); document.getElementById(`cat_group_${catId}`).classList.add('drag-over'); }
        function leaveDrop(e, catId) { if (!isAdmin) return; document.getElementById(`cat_group_${catId}`).classList.remove('drag-over'); }
        function dropChannel(e, targetCatId) {
            if (!isAdmin) return;
            e.preventDefault();
            if (!draggedChannelId) return;
            let ch = channels.find(c => c.id === draggedChannelId);
            if (ch) { ch.catId = targetCatId; saveAndSync(); }
        }

        function cardDragStart(e, index) { if (!isAdmin) return; draggedCardIndex = index; e.target.classList.add('dragging'); }
        function cardDragEnd(e) { if (!isAdmin) return; draggedCardIndex = null; document.querySelectorAll('.card').forEach(el => el.classList.remove('dragging', 'drag-over')); }
        function cardDragOver(e) { if (!isAdmin) return; e.preventDefault(); const card = e.target.closest('.card'); if (card) { document.querySelectorAll('.card').forEach(el => el.classList.remove('drag-over')); card.classList.add('drag-over'); } }
        function cardDrop(e, targetIndex) {
            if (!isAdmin) return;
            e.preventDefault();
            if (draggedCardIndex === null || draggedCardIndex === targetIndex) return;
            let targetData = db[currentTab];
            if (!targetData) return;
            let movedItem = targetData.splice(draggedCardIndex, 1)[0];
            targetData.splice(targetIndex, 0, movedItem);
            saveAndSync();
        }

        function copyCard(tabKey, index) {
            if (!isAdmin) return;
            const item = db[tabKey][index];
            if (item) {
                copiedCardData = JSON.parse(JSON.stringify(item));
                document.getElementById('pasteBtn').style.display = 'block';
                alert(`已複製卡片：「${item.name}」！`);
            }
        }
        function pasteCard() {
            if (!isAdmin || !copiedCardData || !currentTab) return;
            if (!db[currentTab]) db[currentTab] = [];
            db[currentTab].push(JSON.parse(JSON.stringify(copiedCardData)));
            saveAndSync();
            alert('卡片貼上成功！');
        }

        function toggleCategory(catId) {
            collapsedCategories[catId] = !collapsedCategories[catId];
            localStorage.setItem('division2_collapsed_v21', JSON.stringify(collapsedCategories));
            document.getElementById(`cat_group_${catId}`).classList.toggle('collapsed');
        }

        function showContextMenu(e, type, id) {
            if (!isAdmin) return;
            e.preventDefault();
            e.stopPropagation();
            contextMenuTarget = { type, id };
            const menu = document.getElementById('dcContextMenu');
            document.getElementById('menuAddChannel').style.display = (type === 'cat') ? 'block' : 'none';
            menu.style.display = 'block';
            let x = e.clientX, y = e.clientY;
            if (x + 170 > window.innerWidth) x -= 170;
            if (y + 160 > window.innerHeight) y -= 160;
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
        }
        function hideContextMenu() { const menu = document.getElementById('dcContextMenu'); if (menu) menu.style.display = 'none'; }

        function handleMenuAddChannel() { if (!isAdmin || !contextMenuTarget) return; openChannelModal('', '', contextMenuTarget.id); hideContextMenu(); }
        function handleMenuEdit() {
            if (!isAdmin || !contextMenuTarget) return;
            if (contextMenuTarget.type === 'cat') {
                let cat = categories.find(c => c.id === contextMenuTarget.id);
                if (cat) openCategoryModal(cat.id, cat.name);
            } else {
                let ch = channels.find(c => c.id === contextMenuTarget.id);
                if (ch) openChannelModal(ch.id, ch.name, ch.catId);
            }
            hideContextMenu();
        }
        function handleMenuDelete() {
            if (!isAdmin || !contextMenuTarget) return;
            if (contextMenuTarget.type === 'cat') deleteCategory(contextMenuTarget.id);
            else deleteChannel(contextMenuTarget.id);
            hideContextMenu();
        }
        function handleMenuMoveUp() {
            if (!isAdmin || !contextMenuTarget) return;
            let list = contextMenuTarget.type === 'cat' ? categories : channels;
            let idx = list.findIndex(c => c.id === contextMenuTarget.id);
            if (idx > 0) { let t = list[idx]; list[idx] = list[idx-1]; list[idx-1] = t; saveAndSync(); }
            hideContextMenu();
        }
        function handleMenuMoveDown() {
            if (!isAdmin || !contextMenuTarget) return;
            let list = contextMenuTarget.type === 'cat' ? categories : channels;
            let idx = list.findIndex(c => c.id === contextMenuTarget.id);
            if (idx < list.length - 1) { let t = list[idx]; list[idx] = list[idx+1]; list[idx+1] = t; saveAndSync(); }
            hideContextMenu();
        }

        function switchTab(tabName) { currentTab = tabName; renderSidebar(); filterData(); }

        function filterData() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';
            let targetData = db[currentTab] || [];

            targetData.forEach((item, index) => {
                const matchName = item.name.toLowerCase().includes(keyword);
                const matchAttr = item.attrs ? item.attrs.some(a => a.text.toLowerCase().includes(keyword) || a.val.toLowerCase().includes(keyword)) : false;
                const matchEffect = item.effect ? item.effect.toLowerCase().includes(keyword) : false;
                
                if (matchName || matchAttr || matchEffect) {
                    let card = document.createElement('div');
                    card.className = isAdmin ? 'card editable' : 'card';
                    if (isAdmin) {
                        card.draggable = true;
                        card.setAttribute('ondragstart', `cardDragStart(event, ${index})`);
                        card.setAttribute('ondragend', `cardDragEnd(event)`);
                        card.setAttribute('ondragover', `cardDragOver(event)`);
                        card.setAttribute('ondrop', `cardDrop(event, ${index})`);
                    }

                    let weaponImgHtml = '';
                    if (item.weaponImg) {
                        weaponImgHtml = `<img src="${item.weaponImg}" class="card-weapon-img">`;
                    }

                    let html = `
                        <div class="card-header-container">
                            <h4>
                                <div class="card-header-left"><span class="${item.color || 'color-gold'}">${item.name}</span></div>
                            </h4>
                            ${weaponImgHtml}
                        </div>
                    `;
                    if (item.effect) html += `<div style="font-size: 13px; color: #dbdee1; margin: 6px 0; white-space: pre-line;">${linkify(item.effect)}</div>`;
                    if (item.spoiler) html += `<div>${item.spoiler}</div>`;
                    if (item.attrs) {
                        item.attrs.forEach(attr => {
                            let leftImgHtml = attr.leftImg ? `<img src="${attr.leftImg}" style="width: 16px; height: 16px; object-fit: contain; vertical-align: middle; display: inline-block;"> ` : '';
                            let rightImgHtml = attr.rightImg ? ` <img src="${attr.rightImg}" style="width: 16px; height: 16px; object-fit: contain; vertical-align: middle; display: inline-block;">` : '';
                            
                            let attrTextContent = `${leftImgHtml}${attr.text}${rightImgHtml}`;
                            let valContent = linkify(attr.val);

                            html += `<div class="attr-item"><span class="attr-text-side">${attrTextContent}</span><span class="attr-val">${valContent}</span></div>`;
                        });
                    }
                    if (item.named) html += `<div><span class="badge">標籤：${item.named}</span></div>`;
                    if (isAdmin) {
                        html += `
                            <div class="card-actions" style="display: flex;">
                                <button class="btn-copy" onclick="copyCard('${currentTab}', ${index})">複製</button>
                                <button class="btn-edit" onclick="openEditModal('${currentTab}', ${index})">編輯</button>
                                <button class="btn-delete" onclick="deleteData('${currentTab}', ${index})">刪除</button>
                            </div>
                        `;
                    }
                    card.innerHTML = html;
                    grid.appendChild(card);
                }
            });

            if (grid.children.length === 0) {
                grid.innerHTML = `<div style="color: #949ba4; padding: 20px;">此頻道目前沒有資料或找不到符合的搜尋結果...</div>`;
            }
        }

        function openModal() {
            if (!isAdmin || !currentTab) { alert('請先選擇頻道！'); return; }
            document.getElementById('modalTitle').innerText = '新增資料';
            document.getElementById('editIndex').value = '-1';
            document.getElementById('editTabKey').value = currentTab;

            document.getElementById('inputName').value = '';
            currentWeaponImgBase64 = '';
            document.getElementById('weaponImgPreviewBox').innerHTML = `<span style="font-size: 13px; color: #949ba4;">＋ 點擊上傳武器大圖</span>`;
            document.getElementById('inputColor').value = 'color-gold';
            document.getElementById('inputEffect').value = '';
            document.getElementById('inputIsSpoiler').checked = false;
            document.getElementById('inputSpoilerContent').value = '';
            document.getElementById('inputSpoilerContent').style.display = 'none';
            document.getElementById('inputNamed').value = '';
            document.getElementById('attrContainer').innerHTML = '';
            addAttrRow('核心屬性', '', '', '');
            document.getElementById('addModal').style.display = 'flex';
        }

        function openEditModal(tabKey, index) {
            if (!isAdmin) return;
            const item = db[tabKey][index];
            document.getElementById('modalTitle').innerText = '編輯資料';
            document.getElementById('editIndex').value = index;
            document.getElementById('editTabKey').value = tabKey;

            document.getElementById('inputName').value = item.name || '';
            
            currentWeaponImgBase64 = item.weaponImg || '';
            const weaponPreviewBox = document.getElementById('weaponImgPreviewBox');
            if (currentWeaponImgBase64) {
                weaponPreviewBox.innerHTML = `<img src="${currentWeaponImgBase64}" style="width: 100%; height: 100%; object-fit: contain; border-radius: 4px;">`;
            } else {
                weaponPreviewBox.innerHTML = `<span style="font-size: 13px; color: #949ba4;">＋ 點擊上傳武器大圖</span>`;
            }

            document.getElementById('inputColor').value = item.color || 'color-gold';
            document.getElementById('inputEffect').value = item.effect || '';
            
            const spoilerBox = document.getElementById('inputSpoilerContent');
            if (item.spoiler) {
                document.getElementById('inputIsSpoiler').checked = true;
                spoilerBox.style.display = 'block';
                let matchP = item.spoiler.match(/<p[^>]*>([\s\S]*?)<\/p>/);
                let raw = matchP ? matchP[1].replace(/<br\s*[\/]?>/gi, '\n') : '';
                spoilerBox.value = raw.replace(/<a[^>]*href="([^"]*)"[^>]*>.*?<\/a>/gim, '$1');
            } else {
                document.getElementById('inputIsSpoiler').checked = false;
                spoilerBox.style.display = 'none';
                spoilerBox.value = '';
            }
            document.getElementById('inputNamed').value = item.named || '';
            
            const container = document.getElementById('attrContainer');
            container.innerHTML = '';
            if (item.attrs) {
                item.attrs.forEach(attr => {
                    addAttrRow(attr.text, attr.val, attr.leftImg || '', attr.rightImg || '');
                });
            }
            document.getElementById('addModal').style.display = 'flex';
        }

        function addAttrRow(text = '', val = '', leftImg = '', rightImg = '') {
            const container = document.getElementById('attrContainer');
            const row = document.createElement('div');
            row.className = 'attr-row';
            row.dataset.leftImg = leftImg;
            row.dataset.rightImg = rightImg;

            let leftPreviewHtml = leftImg ? `<img src="${leftImg}" style="width: 20px; height: 20px; object-fit: contain; background: #111; border-radius: 3px;" title="左側圖示">` : `<span style="font-size: 10px; color: #949ba4;">左圖</span>`;
            let rightPreviewHtml = rightImg ? `<img src="${rightImg}" style="width: 20px; height: 20px; object-fit: contain; background: #111; border-radius: 3px;" title="右側圖示">` : `<span style="font-size: 10px; color: #949ba4;">右圖</span>`;

            row.innerHTML = `
                <div class="left-img-box" style="display: flex; align-items: center; justify-content: center; cursor: pointer; width: 32px; height: 28px; background: #1e1f22; border: 1px solid #222; border-radius: 3px;" onclick="this.nextElementSibling.click()" oncontextmenu="handleAttrImgContextMenu(event, 'left')" title="點擊上傳左側圖示 (右鍵清除)">
                    ${leftPreviewHtml}
                </div>
                <input type="file" accept="image/*" style="display:none;" onchange="handleAttrImgUpload(this, 'left')">

                <input type="text" class="attr-text" placeholder="屬性名稱" value="${text}" style="width: 90px; margin: 0;">

                <div class="right-img-box" style="display: flex; align-items: center; justify-content: center; cursor: pointer; width: 32px; height: 28px; background: #1e1f22; border: 1px solid #222; border-radius: 3px;" onclick="this.nextElementSibling.click()" oncontextmenu="handleAttrImgContextMenu(event, 'right')" title="點擊上傳右側圖示 (右鍵清除)">
                    ${rightPreviewHtml}
                </div>
                <input type="file" accept="image/*" style="display:none;" onchange="handleAttrImgUpload(this, 'right')">

                <input type="text" class="attr-val-input" placeholder="數值或說明" value="${val}" style="flex: 1; margin: 0;">
                <button type="button" class="btn-remove-attr" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(row);
        }

        function handleAttrImgUpload(input, position) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result;
                    const row = input.closest('.attr-row');
                    if (position === 'left') {
                        row.dataset.leftImg = base64;
                        row.querySelector('.left-img-box').innerHTML = `<img src="${base64}" style="width: 20px; height: 20px; object-fit: contain; background: #111; border-radius: 3px;">`;
                    } else {
                        row.dataset.rightImg = base64;
                        row.querySelector('.right-img-box').innerHTML = `<img src="${base64}" style="width: 20px; height: 20px; object-fit: contain; background: #111; border-radius: 3px;">`;
                    }
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function handleAttrImgContextMenu(e, position) {
            e.preventDefault();
            const row = e.target.closest('.attr-row');
            if (position === 'left' && row.dataset.leftImg) {
                if (confirm('確定要清除左側圖示嗎？')) {
                    row.dataset.leftImg = '';
                    row.querySelector('.left-img-box').innerHTML = `<span style="font-size: 10px; color: #949ba4;">左圖</span>`;
                }
            } else if (position === 'right' && row.dataset.rightImg) {
                if (confirm('確定要清除右側圖示嗎？')) {
                    row.dataset.rightImg = '';
                    row.querySelector('.right-img-box').innerHTML = `<span style="font-size: 10px; color: #949ba4;">右圖</span>`;
                }
            }
        }

        function closeModal() { document.getElementById('addModal').style.display = 'none'; }

        function openCategoryModal(id = '', name = '') {
            if (!isAdmin) return;
            document.getElementById('editCategoryId').value = id;
            document.getElementById('inputCategoryName').value = name;
            document.getElementById('categoryModal').style.display = 'flex';
        }
        function closeCategoryModal() { document.getElementById('categoryModal').style.display = 'none'; }

        function saveCategory() {
            if (!isAdmin) return;
            const id = document.getElementById('editCategoryId').value;
            const name = document.getElementById('inputCategoryName').value.trim();
            if (!name) { alert('請填寫類別名稱！'); return; }
            if (id) {
                let cat = categories.find(c => c.id === id);
                if (cat) cat.name = name;
            } else {
                categories.push({ id: 'cat_' + Date.now(), name: name });
            }
            saveAndSync();
            closeCategoryModal();
        }
        function deleteCategory(catId) {
            if (!isAdmin || !confirm('確定要刪除此類別及其底下所有頻道嗎？')) return;
            channels = channels.filter(ch => ch.catId !== catId);
            categories = categories.filter(c => c.id !== catId);
            saveAndSync();
        }

        function openChannelModal(id = '', name = '', catId = '') {
            if (!isAdmin) return;
            const select = document.getElementById('inputChannelCategory');
            select.innerHTML = '';
            categories.forEach(cat => {
                select.innerHTML += `<option value="${cat.id}" ${cat.id === catId ? 'selected' : ''}>${cat.name}</option>`;
            });
            document.getElementById('editChannelId').value = id;
            document.getElementById('inputChannelName').value = name;
            document.getElementById('channelModal').style.display = 'flex';
        }
        function closeChannelModal() { document.getElementById('channelModal').style.display = 'none'; }

        function saveChannel() {
            if (!isAdmin) return;
            const id = document.getElementById('editChannelId').value;
            const catId = document.getElementById('inputChannelCategory').value;
            const name = document.getElementById('inputChannelName').value.trim();
            if (!name) { alert('請填寫頻道名稱！'); return; }
            if (id) {
                let ch = channels.find(c => c.id === id);
                if (ch) { ch.name = name; ch.catId = catId; }
            } else {
                const newId = 'ch_' + Date.now();
                channels.push({ id: newId, name: name, catId: catId });
                db[newId] = [];
                currentTab = newId;
            }
            saveAndSync();
            closeChannelModal();
        }
        function deleteChannel(chId) {
            if (!isAdmin || !confirm('確定要刪除此頻道及所有卡片嗎？')) return;
            channels = channels.filter(c => c.id !== chId);
            delete db[chId];
            currentTab = channels.length > 0 ? channels[0].id : '';
            saveAndSync();
        }

        function saveData() {
            if (!isAdmin) return;
            const index = parseInt(document.getElementById('editIndex').value);
            const targetTab = document.getElementById('editTabKey').value || currentTab;
            const name = document.getElementById('inputName').value.trim();
            const color = document.getElementById('inputColor').value;
            const effect = document.getElementById('inputEffect').value.trim();
            const isSpoiler = document.getElementById('inputIsSpoiler').checked;
            const spoilerText = document.getElementById('inputSpoilerContent').value.trim();
            const named = document.getElementById('inputNamed').value.trim();

            if (!name) { alert('請至少填寫名稱！'); return; }

            let newItem = { name: name, color: color };
            if (currentWeaponImgBase64) newItem.weaponImg = currentWeaponImgBase64;
            if (effect) newItem.effect = effect;
            if (isSpoiler && spoilerText) {
                newItem.spoiler = `<details><summary>點擊展開攻略 (防劇透)</summary><p style='margin: 5px 0 0 0;'>${linkify(spoilerText).replace(/\n/g, '<br>')}</p></details>`;
            }
            if (named) newItem.named = named;

            let attrs = [];
            document.querySelectorAll('.attr-row').forEach(row => {
                const t = row.querySelector('.attr-text').value.trim();
                const v = row.querySelector('.attr-val-input').value.trim();
                const leftImg = row.dataset.leftImg || '';
                const rightImg = row.dataset.rightImg || '';
                if (t || v || leftImg || rightImg) {
                    attrs.push({ 
                        text: t || "屬性", 
                        val: v || "", 
                        leftImg: leftImg, 
                        rightImg: rightImg 
                    });
                }
            });
            newItem.attrs = attrs;

            if (!db[targetTab]) db[targetTab] = [];
            if (index === -1) db[targetTab].push(newItem);
            else db[targetTab][index] = newItem;

            saveAndSync();
            closeModal();
        }

        function deleteData(tabKey, index) {
            if (!isAdmin || !confirm('確定要刪除這筆資料嗎？')) return;
            db[tabKey].splice(index, 1);
            saveAndSync();
        }

        function saveAndSync() {
            if (!isAdmin) return;
            localStorage.setItem('division2_categories_v21', JSON.stringify(categories));
            localStorage.setItem('division2_channels_v21', JSON.stringify(channels));
            localStorage.setItem('division2_db_v21', JSON.stringify(db));
            renderSidebar();
            filterData();
        }

        initData();
    </script>
</body>
</html>
